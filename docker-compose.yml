name: gprn

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: gprn
      POSTGRES_USER: gprn
      POSTGRES_PASSWORD: gprn_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gprn -d gprn"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2026-08-07T18-37-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  create-buckets:
    image: minio/mc:RELEASE.2026-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/gprn-public &&
        mc mb --ignore-existing local/gprn-private &&
        mc anonymous set download local/gprn-public

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: ["pnpm", "--filter", "@gprn/api", "dev"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
    env_file:
      - .env
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - node-modules:/app/node_modules

  worker:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: ["pnpm", "--filter", "@gprn/worker", "dev"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - .:/app
      - node-modules:/app/node_modules

  web:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: ["pnpm", "--filter", "@gprn/web", "dev"]
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node-modules:/app/node_modules

volumes:
  minio-data:
  node-modules:
  postgres-data:
  redis-data:

