name: gprn

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: gprn
      POSTGRES_USER: gprn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gprn -d gprn"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data
    networks:
      - internal

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env.production}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env.production}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    # These are loopback-only: use an SSH tunnel for MinIO administration.
    ports:
      - "127.0.0.1:${MINIO_API_BIND_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_BIND_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - internal

  create-buckets:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
        mc mb --ignore-existing local/$${S3_BUCKET_PUBLIC} &&
        mc mb --ignore-existing local/$${S3_BUCKET_PRIVATE} &&
        mc anonymous set download local/$${S3_BUCKET_PUBLIC}
    env_file:
      - .env.production
    networks:
      - internal

  migrate:
    build:
      context: .
      dockerfile: infra/docker/node.production.Dockerfile
    restart: "no"
    command: ["pnpm", "--filter", "@gprn/db", "db:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: infra/docker/node.production.Dockerfile
    restart: unless-stopped
    init: true
    command: ["pnpm", "--filter", "@gprn/api", "start"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
    env_file:
      - .env.production
    # Caddy on the host is the only public entry point.
    ports:
      - "127.0.0.1:${API_BIND_PORT:-14000}:4000"
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: infra/docker/node.production.Dockerfile
    restart: unless-stopped
    init: true
    command: ["pnpm", "--filter", "@gprn/worker", "start"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
    env_file:
      - .env.production
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: infra/docker/node.production.Dockerfile
    restart: unless-stopped
    init: true
    command: ["pnpm", "--filter", "@gprn/web", "start"]
    depends_on:
      api:
        condition: service_started
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:${WEB_BIND_PORT:-13000}:3000"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  redis-data:
